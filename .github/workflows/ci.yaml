name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Scopes granted to the injected GITHUB_TOKEN. This block is required, not
# cosmetic: with no `permissions` key the token inherits the repo/org default,
# which can be read-and-write across contents, issues, packages, and more.
# Naming any one scope implicitly sets every unnamed scope to `none`.
#
# `contents: read` is the only scope this workflow needs, for actions/checkout.
# It never comments on a PR, pushes a commit, or publishes a package. That
# matters because the install step runs lifecycle scripts from the whole
# dependency tree, so a compromised package would otherwise inherit whatever
# write access the default happened to grant.
#
# Flagged by CodeQL as actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  ci:
    name: Build and Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version` input on purpose: the action reads `packageManager` from
      # package.json, which keeps CI on the same pnpm as local checkouts.
      # Without that pin, action-setup v6 would default to pnpm 11.
      # Must stay ahead of setup-node below, since `cache: pnpm` needs pnpm
      # on PATH to locate the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Build project
        run: pnpm run build
